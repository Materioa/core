# Keeps the MongoDB version snapshot fresh.
#
# The health endpoint reads the served version from the committed
# releases.json, refreshed here daily. The public read APIs that
# used to fall back to static JSON (promotions / releases / examdata)
# are Mongo-only now, so only that one file is synced.
#
# Required repo secret: MONGODB_URI (read-only DB user is enough).

name: Sync Mongo Snapshots

on:
  schedule:
    # Daily 02:00 UTC (~07:30 IST)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Dump Mongo collections to static JSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mongodb driver only
        shell: bash
        run: npm install --no-save --no-audit --no-fund mongodb

      - name: Run snapshot sync
        shell: bash
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node scripts/sync-mongo-snapshot.mjs

      - name: Commit if changed
        shell: bash
        run: |
          if git diff --quiet -- static/assets/data/releases.json; then
            echo "Snapshot already fresh, nothing to commit."
            exit 0
          fi
          git config user.name "materio-snapshot-bot"
          git config user.email "snapshot-bot@getmaterio.app"
          git add static/assets/data/releases.json
          git commit -m "chore: refresh releases snapshot [skip ci]"
          git push
