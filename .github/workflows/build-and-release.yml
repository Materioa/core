name: Build & Release Apps

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which apps to build'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - android
          - windows

permissions:
  contents: write

env:
  # Auto-increment: major.minor.patch where patch = run_number
  # Override with a tag push (v3.0.0) for manual version control
  APP_VERSION_FALLBACK: "2.1.${{ github.run_number }}"

jobs:
  # ─────────────────────────────────────────────
  #  Resolve the version once, share across jobs
  # ─────────────────────────────────────────────
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.VERSION }}
      tag: ${{ steps.ver.outputs.TAG }}
    steps:
      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW="${GITHUB_REF#refs/tags/v}"
          else
            RAW="${{ env.APP_VERSION_FALLBACK }}"
          fi
          echo "VERSION=${RAW}" >> $GITHUB_OUTPUT
          echo "TAG=v${RAW}" >> $GITHUB_OUTPUT
          echo "📦 Version: ${RAW}  Tag: v${RAW}"

  # ─────────────────────────────────────────────
  #  Which platforms does this push touch?
  #  Website-only pushes build NEITHER native app; android/** builds
  #  Android only; src-tauri/** builds Windows only. Tags and manual
  #  runs default to both (dispatch can narrow via the platform input).
  # ─────────────────────────────────────────────
  changes:
    name: Detect Changed Platforms
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.set.outputs.android }}
      windows: ${{ steps.set.outputs.windows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed paths
        id: set
        shell: bash
        run: |
          ANDROID=true
          WINDOWS=true
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" != refs/tags/* ]]; then
            BEFORE="${{ github.event.before }}"
            if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              BEFORE="HEAD~1"
            fi
            FILES=$(git diff --name-only "$BEFORE" "${{ github.sha }}" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
            echo "--- changed files ---"
            echo "$FILES"
            ANDROID=false
            WINDOWS=false
            # The app bundles are built from src/ (npm run build:static), so a
            # change there only reaches users if the apps are rebuilt. This
            # filter used to trigger on android/, src-tauri/ and this workflow
            # file alone, which meant src/ changes produced NO app build at
            # all — every web-side fix silently stopped at the web.
            APP_PATHS='^(src/|packages/|package\.json$|package-lock\.json$|capacitor\.config\.json|vite\.config\.|svelte\.config\.|tailwind\.config\.|postcss\.config\.)'
            # BOTH apps, not Android only. src/ is the whole Svelte app: the
            # desktop app bundles it via `npm run build:static` (see
            # tauri.conf.json beforeBuildCommand), so a change here reaches
            # Windows users only if a Windows build runs. This previously set
            # ANDROID alone, which meant every src/ push published an APK and
            # no installer - the desktop app silently kept serving the previous
            # bundle.
            echo "$FILES" | grep -Eq "$APP_PATHS" && { ANDROID=true; WINDOWS=true; } || true
            if echo "$FILES" | grep -Eq '^(src-tauri/|android/|\.github/workflows/build-and-release\.yml)'; then
              ANDROID=true
              WINDOWS=true
            fi
          fi
          if [[ "${{ github.event.inputs.platform }}" == "android" ]]; then WINDOWS=false; fi
          if [[ "${{ github.event.inputs.platform }}" == "windows" ]]; then ANDROID=false; fi
          echo "android=$ANDROID" >> $GITHUB_OUTPUT
          echo "windows=$WINDOWS" >> $GITHUB_OUTPUT
          echo "▶ android=$ANDROID windows=$WINDOWS"

  # ─────────────────────────────────────────────
  #  Windows (Tauri)
  # ─────────────────────────────────────────────
  build-windows:
    name: Build Windows App (Tauri)
    needs: [resolve-version, changes]
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stamp version into config files
        shell: bash
        run: |
          VER="${{ needs.resolve-version.outputs.version }}"
          # tauri.conf.json
          sed -i "s/\"version\": \".*\"/\"version\": \"${VER}\"/" src-tauri/tauri.conf.json
          # Cargo.toml
          sed -i "s/^version = \".*\"/version = \"${VER}\"/" src-tauri/Cargo.toml
          # package.json
          sed -i "s/\"version\": \".*\"/\"version\": \"${VER}\"/" package.json
          echo "✅ Stamped version ${VER}"
          grep '"version"' src-tauri/tauri.conf.json
          grep '^version' src-tauri/Cargo.toml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm install

      - name: Generate App Icons
        run: npm run icons:generate

      - name: Build SvelteKit Frontend
        run: npm run build:static
        env:
          APP_VERSION: ${{ needs.resolve-version.outputs.version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build MCP Server Executable
        working-directory: mcp
        run: |
          bun install
          bun build --compile --target=bun-windows-x64 src/index.ts --outfile materio-mcp.exe

      - name: Build Tauri Desktop App
        run: npx tauri build

      - name: Prepare Windows Release Artifacts
        shell: bash
        run: |
          VER="${{ needs.resolve-version.outputs.version }}"
          mkdir -p release-windows
          # One asset per format, versioned Tauri names only:
          #   Materio_<ver>_x64-setup.exe (NSIS installer, used by in-app updater)
          #   Materio_<ver>_x64_en-US.msi
          # No unversioned aliases, no standalone binary, no updater
          # signatures (the Tauri updater plugin is not configured).
          if [ -d "src-tauri/target/release/bundle" ]; then
            find src-tauri/target/release/bundle/ -type f \( -name "*.msi" -o -name "*-setup.exe" \) -exec cp {} release-windows/ \;
          fi
          ls -la release-windows/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: release-windows/*
          if-no-files-found: error

  # ─────────────────────────────────────────────
  #  Android (Capacitor)
  # ─────────────────────────────────────────────
  build-android:
    name: Build Android App (Capacitor)
    needs: [resolve-version, changes]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stamp version into config files
        shell: bash
        run: |
          VER="${{ needs.resolve-version.outputs.version }}"
          sed -i "s/\"version\": \".*\"/\"version\": \"${VER}\"/" package.json
          echo "✅ Stamped version ${VER}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install

      - name: Generate App Icons
        run: npm run icons:generate

      - name: Build SvelteKit Web App
        run: npm run build:static
        env:
          APP_VERSION: ${{ needs.resolve-version.outputs.version }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Bump Android versionCode
        shell: bash
        run: |
          VCODE=$(( 20000 + ${{ github.run_number }} ))
          VNAME="${{ needs.resolve-version.outputs.version }}"
          GRADLE="android/app/build.gradle"
          if [ -f "$GRADLE" ]; then
            sed -i "s/versionCode [0-9]*/versionCode ${VCODE}/" "$GRADLE"
            sed -i "s/versionName \".*\"/versionName \"${VNAME}\"/" "$GRADLE"
            echo "✅ Android versionCode=${VCODE} versionName=${VNAME}"
          VARS="android/variables.gradle"
          if [ -f "$VARS" ]; then
            sed -i "s/compileSdkVersion = [0-9]*/compileSdkVersion = 34/" "$VARS"
            sed -i "s/minSdkVersion = [0-9]*/minSdkVersion = 22/" "$VARS"
            sed -i "s/targetSdkVersion = [0-9]*/targetSdkVersion = 34/" "$VARS"
            echo "✅ Enforced compileSdkVersion=34 targetSdkVersion=34 minSdkVersion=22"
          fi
          fi

      - name: Ensure Android Release Keystore
        working-directory: android/app
        shell: bash
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v -keystore release.keystore -alias materio -keyalg RSA -keysize 2048 -validity 10000 -storepass materio123 -keypass materio123 -dname "CN=Materio, OU=App, O=Materio, L=San Francisco, ST=California, C=US"
          fi

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Prepare Android Release Artifacts
        shell: bash
        run: |
          VER="${{ needs.resolve-version.outputs.version }}"
          mkdir -p release-android
          # Single versioned APK, same convention as Windows:
          #   Materio_<ver>_arm64.apk (no debug builds, no aliases)
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "release-android/Materio_${VER}_arm64.apk"
          fi
          ls -la release-android/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: release-android/*
          if-no-files-found: error

  # ─────────────────────────────────────────────
  #  Publish Release + Updater JSON
  # ─────────────────────────────────────────────
  publish-release:
    name: Publish to GitHub Releases
    needs: [resolve-version, changes, build-windows, build-android]
    if: always() && !cancelled() && (needs.build-windows.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Release Assets Directory
        run: mkdir -p release-assets

      - name: Download Windows Artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release-assets

      - name: Download Android Artifacts
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-binaries
          path: release-assets

      - name: List Release Assets
        shell: bash
        run: |
          echo "Assets prepared for release:"
          ls -lh release-assets/

      - name: Delete existing release (if same tag)
        shell: bash
        run: |
          TAG="${{ needs.resolve-version.outputs.tag }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose Release Notes
        shell: bash
        run: |
          VER="${{ needs.resolve-version.outputs.version }}"
          TAG="${{ needs.resolve-version.outputs.tag }}"
          {
            echo "## Materio ${TAG}"
            echo ""
            echo "### Included in this build"
            if [[ "${{ needs.build-windows.result }}" == "success" ]]; then
              echo "- **Windows Desktop:** \`Materio_${VER}_x64-setup.exe\` installer (plus \`.msi\`) with offline reading, system tray, and bundled local MCP server (\`localhost:3000/mcp\`)."
            fi
            if [[ "${{ needs.build-android.result }}" == "success" ]]; then
              echo "- **Android APK:** \`Materio_${VER}_arm64.apk\` — fast, mobile-optimized companion with background in-app updates."
            fi
            echo ""
            echo "### What's new"
            echo "Auto-bump build \`${VER}\` from commit \`${{ github.sha }}\`."
          } > release-notes.md
          cat release-notes.md

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: Materio Apps ${{ needs.resolve-version.outputs.tag }}
          make_latest: true
          draft: false
          prerelease: false
          bodyFile: release-notes.md
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
