<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>annot harness</title>
<style>body{margin:0;font:13px monospace}#log{white-space:pre-wrap;padding:8px;background:#111;color:#0f0}</style>
</head>
<body>
<pre id="log">booting…</pre>
<iframe id="fr" style="width:1200px;height:800px;border:1px solid #888"></iframe>
<script>
// Mirrors PdfReaderModal + sidecar.js, but against the REAL pdf.mjs/viewer.mjs.
// Answers: does a saved highlight actually get restored on a cold open?
const PDF_URL = '/build/assets/data/Seating%20Arrangement_7th%20Sem_Btech.pdf';

// Exactly the shape HighlightEditor.serialize() emits in this pdf.mjs build:
//   { annotationType: 9, color, opacity, thickness, quadPoints: Float32Array,
//     outlines, pageIndex, rect, rotation, structTreeParentId, id }
const SAVED = {
  id: 'pdf0178',
  annotationType: 9,
  color: [135, 203, 140],
  opacity: 1,
  thickness: 1,
  quadPoints: new Float32Array([40, 60, 300, 60, 40, 80, 300, 80]),
  outlines: null,
  pageIndex: 0,
  rect: [40, 60, 300, 80],
  rotation: 0,
  structTreeParentId: null,
};

const lines = [];
const STORAGE = window.__P || { [SAVED.id]: SAVED };
const log = (...a) => { lines.push(a.join(' ')); out.textContent = lines.join('\n'); };
const out = document.getElementById('log');
const fr = document.getElementById('fr');
// ?page=N opens the viewer on a page other than page 1, so a test can check
// that an annotation on a page the reader never scrolled to still restores.
const startPage = new URLSearchParams(location.search).get('page');

window.addEventListener('message', (e) => {
  if (!e.data || typeof e.data.type !== 'string') return;
  const d = e.data;
  if (d.type === 'materioAnnotReady') {
    log('<- materioAnnotReady  (posting init)');
    fr.contentWindow.postMessage({ type: 'materioAnnotInit', annotations: { storage: STORAGE } }, '*');
  } else if (d.type === 'materioAnnotSync' || d.type === 'materioAnnotSynced') {
    const st = (d.annotations && d.annotations.storage) || {};
    const n = Object.keys(st).length;
    window.__lastSync = st;
    window.__lastChanged = st;
    window.__lastRemoved = d.removed || [];
    log('<- ' + d.type + '  entries=' + n + (n === 0 ? '   <-- EMPTY' : '') +
        '  removed=' + JSON.stringify(window.__lastRemoved));
  } else if (d.type === 'materioAnnotChanged') {
    // Routine edits. Recorded separately from the sync so a test can prove a
    // DELETION actually leaves the record - the parent refuses a shrink it
    // cannot attribute to a removal, so `removed` is the whole contract.
    const st = (d.annotations && d.annotations.storage) || {};
    window.__lastChanged = st;
    window.__lastRemoved = d.removed || [];
    log('<- materioAnnotChanged  entries=' + Object.keys(st).length +
        '  removed=' + JSON.stringify(window.__lastRemoved));
  } else if (d.type === 'materioAnnotDiag') {
    log('   DIAG ' + d.line);
  }
});

fr.src = '/static/oread/web/viewer.html?file=' + encodeURIComponent(PDF_URL) +
  (startPage ? '#page=' + encodeURIComponent(startPage) : '');

// Capture the viewer's console once it exists (same origin, so reachable).
let patched = false;
const patchConsole = () => {
  if (patched) return;
  try {
    const w = fr.contentWindow;
    const orig = w.console.log.bind(w.console);
    w.console.log = (...a) => { log('   [js] ' + a.map(String).join(' ')); orig(...a); };
    patched = true;
  } catch (e) {}
};

// Record every focus() the VIEWER makes, and mark which of them landed on an
// annotation editor.
//
// This guards the "opening a PDF leaves my annotation selected" bug.
// AnnotationEditorLayer.add() always ends in editor.onceAdded(!#isEnabling).
// PDF.js passes FALSE while it batches editors in through enable(), which is
// why reopening a document through its own code selects nothing. The sidecar's
// restore runs outside enable(), so it used to pass TRUE, and
// HighlightEditor.onceAdded then does div.focus() -> focusin() ->
// setSelected(): the annotation comes back wearing the selection outline and
// the floating colour toolbar, before the reader has clicked anything.
//
// The SELECTED outcome is not reliably observable here - headless Chrome does
// not honour focus() in an unfocused window, so the outcome assertions can
// pass with the bug present. The focus REQUEST cannot be faked away, and it is
// precisely what the fix removes, so this is the assertion that actually bites.
//
// Re-hooked whenever the iframe navigates (its Window/global is replaced, so
// the marker below disappears with it).
const EDITOR_FOCUS = /(?:^|\s)(?:freeTextEditor|highlightEditor|inkEditor|signatureEditor|stampEditor)(?:\s|$)/;
const patchFocus = () => {
  try {
    const w = fr.contentWindow;
    if (!w || !w.HTMLElement || !w.document || w.__focusHooked) return;
    window.__focusLog = [];
    const orig = w.HTMLElement.prototype.focus;
    w.HTMLElement.prototype.focus = function (...a) {
      try {
        const cn = this.className;
        const cls = String(cn && typeof cn === 'object' ? cn.baseVal : (cn || this.tagName));
        window.__focusLog.push({ cls, editor: EDITOR_FOCUS.test(cls) });
      } catch (e) { /* never break focus itself */ }
      return orig.apply(this, a);
    };
    w.__focusHooked = true;
    log('   focus hook installed');
  } catch (e) { /* not ready */ }
};
window.__focusLogAll = () => (window.__focusLog || []).slice();
window.__focusLogReset = () => { window.__focusLog = []; };

const iv = setInterval(() => { patchConsole(); patchFocus(); }, 100);

setTimeout(() => {
  clearInterval(iv);
  let report;
  try {
    const w = fr.contentWindow;
    const A = w.PDFViewerApplication;
    const pv = A.pdfViewer;
    const doc = A.pdfDocument;
    const st = doc.annotationStorage;
    const all = st.getAll();
    const v0 = pv.getPageView(0);
    const builder = v0 && v0.annotationEditorLayer;
    const inner = builder && builder.annotationEditorLayer;
    const edDivs = w.document.querySelectorAll('.annotationEditorLayer > div').length;
    report = {
      docLoaded: !!doc,
      storageEntries: Object.keys(all).length,
      storageKeys: Object.keys(all),
      builderExists: !!builder,
      innerLayerExists: !!inner,
      hasDeserialize: !!(inner && typeof inner.deserialize === 'function'),
      renderedEditorDivs: edDivs,
      editorMode: A.prefs && A.prefs.annotationEditorMode,
    };
  } catch (e) {
    report = { harnessError: String(e && e.stack || e) };
  }
  lines.push('', '===== VERDICT =====', JSON.stringify(report, null, 1));
  out.textContent = lines.join('\n');
}, 12000);
</script>
</body>
</html>
