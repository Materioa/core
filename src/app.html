		<!-- Preload fallback LCP card image with high priority -->

		<!-- Preload core app stylesheet for immediate fast render on app routes -->
		<link rel="preload" href="/assets/style/main.css?v=20261010" as="style" />
		<!-- Core app stylesheet in head prevents FOUC and eliminates layout shifts (CLS) on app routes -->
		<link id="app-main-css" rel="stylesheet" href="/assets/style/main.css?v=20261010" />
		<script>
			(function () {
				var p = window.location.pathname;
				var isNative = Boolean(
					window.__TAURI_INTERNALS__ ||
					window.__TAURI__ ||
					window.location.protocol === 'tauri:' ||
					window.location.protocol === 'capacitor:' ||
					window.location.hostname === 'tauri.localhost' ||
					window.location.hostname === 'capacitor.localhost' ||
					window.Capacitor
				);
				var skipLanding = false;
				try {
					var match = document.cookie.match(/(^| )materio_skip_landing=([^;]+)/);
					if (match) skipLanding = (decodeURIComponent(match[2]) === 'true' || match[2] === '1');
					if (!skipLanding) {
						var lsSkip = localStorage.getItem('materio_skip_landing');
						var lsStart = localStorage.getItem('materio_start_page') || localStorage.getItem('materio_app_start');
						skipLanding = (lsSkip === 'true' || lsSkip === '1' || lsStart === 'app' || lsStart === 'home');
					}
				} catch (e) {}

				var isAppOnRoot = (p === '/' && (isNative || skipLanding || window.__materioForceApp || window.__landingForceApp));
				var isLanding = !isAppOnRoot && (p === '/' || p === '/pricing' || p.startsWith('/pricing/') || p === '/downloads' || p.startsWith('/downloads') || p === '/interviewer' || p.startsWith('/interviewer'));

				if (isLanding) {
					var c = document.getElementById('app-main-css');
					if (c) c.disabled = true;
				} else {
					try {
						window.__materioPosts = fetch('https://room.getmaterio.app/api/posts?num=5')
							.then(function (r) { return r.ok ? r.json() : null; })
							.catch(function () { return null; });
						window.__materioPosts.then(function (d) {
							var list = Array.isArray(d) ? d : (d && d.posts) || [];
							for (var j = 0; j < list.length; j++) {
								var post = list[j];
								var img = post && (post.imgUrl || post.image);
								if (post && post.visibility !== 'private' && img && img !== 'null') {
									var l = document.createElement('link');
									l.rel = 'preload'; l.as = 'image'; l.href = img;
									l.setAttribute('fetchpriority', 'high');
									document.head.appendChild(l);
									break;
								}
							}
						});
					} catch (e) {}
				}
			})();
		</script>

		<!-- Google Tag Manager & Google Analytics (Deferred to user interaction to eliminate main-thread CPU overhead) -->

				var initialized = false;
				function initTracking() {
					if (initialized) return;
					initialized = true;
					cleanup();
					try {
						// Google Tag Manager
						(function (w, d, s, l, i) {
							w[l] = w[l] || []; w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
							var f = d.getElementsByTagName(s)[0], j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : '';
							j.async = true; j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
							f.parentNode.insertBefore(j, f);
						})(window, document, 'script', 'dataLayer', 'GTM-M6PC6RJL');

						// Google Analytics
						var gaScript = document.createElement('script');
						gaScript.async = true;
						gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-MJ4P8TZNBR';
						document.head.appendChild(gaScript);
						gtag('js', new Date());
						gtag('config', 'G-MJ4P8TZNBR');
					} catch (e) {}
				}

				var events = ['pointerdown', 'keydown', 'scroll', 'touchstart'];
				function onInteraction() { initTracking(); }
				function cleanup() {
					events.forEach(function (e) {
						window.removeEventListener(e, onInteraction, { passive: true });
					});
				}

				if (typeof window !== 'undefined') {
					events.forEach(function (e) {
						window.addEventListener(e, onInteraction, { passive: true, once: true });
					});
					if ('requestIdleCallback' in window) {
						window.requestIdleCallback(initTracking, { timeout: 12000 });
					} else {
						setTimeout(initTracking, 12000);
					}
				}
			})();
		</script>
