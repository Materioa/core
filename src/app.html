		<!-- Twitter Meta Tags -->

		<!-- Favicons & Touch Icon -->
		<link rel="apple-touch-icon" href="/assets/img/icon.svg" />
		<link rel="icon" href="/assets/img/favico.png" sizes="32x32" type="image/png" />
		<link rel="icon" href="/assets/img/favicon.png" sizes="128x128" type="image/png" />
		<link rel="icon" type="image/x-icon" href="/assets/img/favicon.svg" sizes="32x32" />
		<link rel="icon" href="/assets/img/i16.svg" sizes="16x16" type="image/svg" />
		<link rel="icon" href="/assets/img/favico.svg" sizes="128x128" type="image/svg" />


		<!-- Brand font preloads: Quadrant + OpenRunde are self-hosted, no external font services -->
		<link rel="preload" href="/fonts/QuadrantNotepad-Regular-BZHKwHCP.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/OpenRunde-Regular.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/OpenRunde-Medium.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/OpenRunde-Semibold.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/OpenRunde-Bold.woff2" as="font" type="font/woff2" crossorigin />

		<!-- Origins for API & CDN assets -->
		<link rel="preconnect" href="https://room.getmaterio.app" crossorigin />
		<link rel="preconnect" href="https://cdn.getmaterio.app" crossorigin />

		<!-- Preload fallback LCP card image with high priority -->
		<link rel="preload" as="image" href="/assets/img/noidea.webp" type="image/webp" fetchpriority="high" />

		<!-- Core app stylesheets in head prevent FOUC and eliminate layout shifts (CLS) on app routes -->
		<link id="app-icons-css" rel="stylesheet" href="/assets/style/icons.css" />
		<link id="app-icon-fallback-css" rel="stylesheet" href="/assets/style/icon-fallback.css" />
		<link id="app-main-css" rel="stylesheet" href="/assets/style/main.css?v=20260926" />
		<link id="app-gestures-css" rel="stylesheet" href="/assets/style/gestures.css" />
		<script>
			(function () {
				var p = window.location.pathname;
				var isLanding = (p === '/' || p === '/pricing' || p.startsWith('/pricing/') || p === '/downloads' || p.startsWith('/downloads'));
				if (isLanding) {
					var c = document.getElementById('app-main-css');
					if (c) c.disabled = true;
				} else {
					try {
						window.__materioPosts = fetch('https://room.getmaterio.app/api/posts?num=5')
							.then(function (r) { return r.ok ? r.json() : null; })
							.catch(function () { return null; });
						window.__materioPosts.then(function (d) {
							var list = Array.isArray(d) ? d : (d && d.posts) || [];
							for (var j = 0; j < list.length; j++) {
								var post = list[j];
								var img = post && (post.imgUrl || post.image);
								if (post && post.visibility !== 'private' && img && img !== 'null') {
									var l = document.createElement('link');
									l.rel = 'preload'; l.as = 'image'; l.href = img;
									l.setAttribute('fetchpriority', 'high');
									document.head.appendChild(l);
									break;
								}
							}
						});
					} catch (e) {}
				}
			})();
		</script>

		<!-- Google Tag Manager & Google Analytics (Deferred to user interaction to eliminate main-thread CPU overhead) -->
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() { window.dataLayer.push(arguments); }
			(function () {
				var initialized = false;
				function initTracking() {
					if (initialized) return;
					initialized = true;
					cleanup();
					try {
						// Google Tag Manager
						(function (w, d, s, l, i) {
							w[l] = w[l] || []; w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
							var f = d.getElementsByTagName(s)[0], j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : '';
							j.async = true; j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
							f.parentNode.insertBefore(j, f);
						})(window, document, 'script', 'dataLayer', 'GTM-M6PC6RJL');

						// Google Analytics
						var gaScript = document.createElement('script');
						gaScript.async = true;
						gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-MJ4P8TZNBR';
						document.head.appendChild(gaScript);
						gtag('js', new Date());
						gtag('config', 'G-MJ4P8TZNBR');
					} catch (e) {}
				}

				var events = ['pointerdown', 'keydown', 'scroll', 'touchstart'];
				function onInteraction() { initTracking(); }
				function cleanup() {
					events.forEach(function (e) {
						window.removeEventListener(e, onInteraction, { passive: true });
					});
				}

				if (typeof window !== 'undefined') {
					events.forEach(function (e) {
						window.addEventListener(e, onInteraction, { passive: true, once: true });
					});
					if ('requestIdleCallback' in window) {
						window.requestIdleCallback(initTracking, { timeout: 12000 });
					} else {
						setTimeout(initTracking, 12000);
					}
				}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
